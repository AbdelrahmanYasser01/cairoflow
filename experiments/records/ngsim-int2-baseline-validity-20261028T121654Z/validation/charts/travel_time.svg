<text class="m" x="393.3" y="280" text-anchor="middle">40</text>
<line class="g" x1="475.0" y1="78" x2="475.0" y2="264"/>
<text class="m" x="475.0" y="280" text-anchor="middle">60</text>
<line class="g" x1="556.7" y1="78" x2="556.7" y2="264"/>
<text class="m" x="556.7" y="280" text-anchor="middle">80</text>
<line class="g" x1="638.3" y1="78" x2="638.3" y2="264"/>
<text class="m" x="638.3" y="280" text-anchor="middle">100</text>
<line class="g" x1="720.0" y1="78" x2="720.0" y2="264"/>
<text class="m" x="720.0" y="280" text-anchor="middle">120</text>
<text class="m" x="720" y="298" text-anchor="end">seconds</text>
<text class="l" x="218" y="103.0" text-anchor="end">N left</text>
<line class="o" x1="447.6" y1="94.0" x2="515.5" y2="94.0" stroke-width="2"/>
