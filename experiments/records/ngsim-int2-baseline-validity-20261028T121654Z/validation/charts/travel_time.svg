<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" height="310" role="img" aria-label="Segment travel time, N and S approaches">
<style>svg{--surface:#fcfcfb;--text:#0b0b0b;--text2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--obs:#2a78d6;--sim:#eb6834}@media (prefers-color-scheme:dark){svg{--surface:#1a1a19;--text:#f0efec;--text2:#c3c2b7;--grid:#2c2c2a;--axis:#383835;--obs:#3987e5;--sim:#d95926}}.bg{fill:var(--surface)}.t{fill:var(--text);font:600 14px system-ui,sans-serif}.l{fill:var(--text2);font:12px system-ui,sans-serif}.m{fill:var(--muted);font:11px system-ui,sans-serif}.g{stroke:var(--grid)}.a{stroke:var(--axis)}.c{stroke:var(--muted)}.o{fill:var(--obs);stroke:var(--obs)}.s{fill:var(--sim);stroke:var(--sim)}.ol{stroke:var(--obs);fill:none;stroke-width:2}.sl{stroke:var(--sim);fill:none;opacity:.7}</style>
<rect class="bg" width="760" height="310"/>
<text class="t" x="16" y="24">Segment travel time, N and S approaches</text>
<text class="m" x="16" y="42">From 100 m upstream on the approach to the exit line; mean per movement</text>
<circle class="o" cx="26" cy="60" r="4.5"/>
<text class="l" x="42" y="64">Observed (NGSIM, derived; 95% interval)</text>
<rect class="s" x="381.5" y="55.5" width="9" height="9" rx="1"/>
<text class="l" x="402" y="64">Simulated (SUMO; seed range)</text>
